scenario_name: steady
description: "Stable moderate request pressure with warm-up and cooldown stages"
total_duration_seconds: 180
host: "http://127.0.0.1:8000"
endpoint: "/work"
random_seed: 42
cpu_iterations: 100000
delay_ms: 20
payload_size: 50
request_timeout_seconds: 10.0
stages:
  - duration_seconds: 30
    target_users: 4
    spawn_rate_per_second: 2.0
  - duration_seconds: 120
    target_users: 12
    spawn_rate_per_second: 4.0
  - duration_seconds: 30
    target_users: 0
    spawn_rate_per_second: 4.0
