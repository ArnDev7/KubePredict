apiVersion: v1
kind: Service
metadata:
  name: kubepredict-grafana
  namespace: kubepredict-monitoring
  labels:
    app.kubernetes.io/name: kubepredict
    app.kubernetes.io/part-of: kubepredict
    app.kubernetes.io/component: monitoring-dashboard
    app.kubernetes.io/managed-by: kustomize
