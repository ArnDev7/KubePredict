              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(apa_http_request_duration_seconds_bucket{job=\"kubepredict-workload\"}[5m])))",
              "legendFormat": "{{pod}}",
              "refId": "A"
