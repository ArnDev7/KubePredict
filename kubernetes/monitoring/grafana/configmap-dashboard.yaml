          "type": "timeseries",
          "description": "Rate of artificial delay seconds injected per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 10
