            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_artificial_delay_seconds_total{job=\"kubepredict-workload\"}[1m]))",
              "legendFormat": "Delay Seconds / s",
              "refId": "A"
            }
