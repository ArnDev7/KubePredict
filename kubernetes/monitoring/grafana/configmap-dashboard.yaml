                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(apa_work_requests_total{job=\"kubepredict-workload\",outcome=\"completed\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "title": "p95 Request Duration by Pod",
          "type": "timeseries",
          "description": "Per-pod 95th percentile HTTP request duration.",
          "datasource": {
            "type": "prometheus",
