            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(apa_work_duration_seconds_bucket{job=\"kubepredict-workload\"}[5m])))",
              "legendFormat": "p95 Work Duration",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "Requests in Progress",
          "type": "stat",
          "description": "Instantaneous count of concurrent HTTP requests being handled.",
          "datasource": {
