        {
          "id": 17,
          "title": "Kubernetes Replica State Baseline",
          "type": "text",
          "description": "Static informational documentation regarding workload replica state and absence of kube-state-metrics.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "options": {
            "mode": "markdown",
            "content": "### Fixed Baseline Replica Context\n\n- **Fixed baseline manifest**: 2 replicas\n- **Live HPA**: absent after Phase 5C\n- **Kubernetes replica state**: currently verified using `kubectl`\n- **kube-state-metrics**: has not yet been installed\n\n*Note: Replica counts are managed declaratively and verified via Kubernetes control plane APIs. Static context panel.*"
          }
        },
        {
          "id": 18,
          "title": "Metrics Server & Prometheus Scope",
          "type": "text",
          "description": "Static informational documentation explaining the architectural boundary between Metrics Server and Prometheus.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "options": {
            "mode": "markdown",
            "content": "### Metrics Architecture Note\n\n- **Metrics Server**: supports Kubernetes resource metrics and HPA (`metrics.k8s.io`)\n- **Metrics Server is not a Prometheus historical data source**\n- **Historical Resource Telemetry**: CPU and memory historical panels require an appropriate Prometheus scrape source (e.g. cAdvisor / kube-state-metrics)\n\n*This dashboard displays application-level Prometheus metrics. Static context panel.*"
          }
        }
