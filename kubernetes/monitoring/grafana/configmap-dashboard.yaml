            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (outcome) (rate(apa_work_requests_total{job=\"kubepredict-workload\"}[1m]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "CPU Iterations Rate",
          "type": "timeseries",
          "description": "Total rate of simulated CPU iterations processed per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
