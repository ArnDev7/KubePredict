apiVersion: v1
kind: ConfigMap
metadata:
  name: kubepredict-grafana-dashboard
  namespace: kubepredict-monitoring
  labels:
    app.kubernetes.io/name: kubepredict
    app.kubernetes.io/part-of: kubepredict
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "0.1.0"
data:
  kubepredict-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Workload Targets Up",
          "type": "stat",
          "description": "Total count of active KubePredict workload targets reported as up by Prometheus.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(up{job=\"kubepredict-workload\"})",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Prometheus Workload Targets Up",
          "type": "stat",
          "description": "Active scrape targets currently reporting up status. Scrape health only, not Kubernetes pod readiness.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(up{job=\"kubepredict-workload\"})",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "description": "Aggregate rate of incoming HTTP requests per second across all workload pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_http_requests_total{job=\"kubepredict-workload\"}[1m]))",
              "legendFormat": "HTTP Request Rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Completed Work Request Rate",
          "type": "timeseries",
          "description": "Aggregate rate of successfully completed work requests per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_work_requests_total{job=\"kubepredict-workload\",outcome=\"completed\"}[1m]))",
              "legendFormat": "Completed Work Rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "p95 HTTP Request Duration",
          "type": "timeseries",
          "description": "95th percentile HTTP request duration across all workload endpoints.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(apa_http_request_duration_seconds_bucket{job=\"kubepredict-workload\"}[5m])))",
              "legendFormat": "p95 Latency",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Average HTTP Request Duration",
          "type": "timeseries",
          "description": "Average HTTP request duration computed from histogram sum and count.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_http_request_duration_seconds_sum{job=\"kubepredict-workload\"}[5m])) / (sum(rate(apa_http_request_duration_seconds_count{job=\"kubepredict-workload\"}[5m])) > 0)",
              "legendFormat": "Avg Latency",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "HTTP 5xx Error Rate",
          "type": "timeseries",
          "description": "HTTP 5xx server error response rate per second across all workload pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_http_requests_total{job=\"kubepredict-workload\",status_code=~\"5..\"}[1m]))",
              "legendFormat": "HTTP 5xx Errors",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Work Outcome Totals",
          "type": "timeseries",
          "description": "Rate of work requests by outcome category (completed, controlled_failure, rejected).",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 4
          },
