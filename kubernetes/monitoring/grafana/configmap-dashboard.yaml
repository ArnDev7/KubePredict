        },
        {
          "id": 11,
          "title": "p95 Work Duration",
          "type": "timeseries",
          "description": "95th percentile duration of synthetic work processing.",
          "datasource": {
            "type": "prometheus",
            "uid": "kubepredict-prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 10
          },
          "fieldConfig": {
