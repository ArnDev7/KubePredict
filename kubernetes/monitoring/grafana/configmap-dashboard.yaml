            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "kubepredict-prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(apa_cpu_iterations_total{job=\"kubepredict-workload\"}[1m]))",
