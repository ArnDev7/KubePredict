apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepredict-prometheus
  namespace: kubepredict-monitoring
  labels:
    app.kubernetes.io/name: kubepredict
    app.kubernetes.io/part-of: kubepredict
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "0.1.0"
# Token automount is explicitly required for Prometheus to perform in-cluster Kubernetes service discovery.
automountServiceAccountToken: true
