# Local kind cluster compatibility patch for Metrics Server
#
# KIND-SPECIFIC NOTICE:
# In local kind (Kubernetes IN Docker) clusters, kubelet serving certificates are
# self-signed and not signed by the cluster certificate authority. Therefore,
# Metrics Server requires '--kubelet-insecure-tls' to scrape kubelet summary APIs.
#
# CAUTION:
# This argument is strictly limited to local development/testing clusters (kind).
# It is NOT suitable for production environments where proper kubelet serving
# certificate signing or trusted CA bundles must be configured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  template:
    spec:
      containers:
      - name: metrics-server
        args:
        - --cert-dir=/tmp
        - --secure-port=10250
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        - --kubelet-insecure-tls
