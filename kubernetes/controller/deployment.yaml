apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepredict-controller
  namespace: kubepredict-system
  labels:
    app.kubernetes.io/name: kubepredict-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: kubepredict
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepredict-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepredict-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: kubepredict
    spec:
      serviceAccountName: kubepredict-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: kubepredict-controller:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "controller.cli", "run-controller", "--metrics-host", "0.0.0.0", "--metrics-port", "9101"]
          envFrom:
            - configMapRef:
                name: kubepredict-controller-config
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
